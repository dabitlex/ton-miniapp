# supabase/config.toml
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# ── Edge Function cron schedules ─────────────────────────────────────
[functions.quest-assignment]
verify_jwt = false

[functions.quest-assignment.cron]
schedule = "0 0 * * *"          # daily at 00:00 UTC

[functions.leaderboard-refresh]
verify_jwt = false

[functions.leaderboard-refresh.cron]
schedule = "*/5 * * * *"         # every 5 minutes

[functions.season-rollover]
verify_jwt = false

[functions.season-rollover.cron]
schedule = "5 0 * * *"           # daily at 00:05 UTC

[functions.notification-sender]
verify_jwt = false

[functions.notification-sender.cron]
schedule = "*/1 * * * *"         # jede Minute — arbeitet notification_queue ab
